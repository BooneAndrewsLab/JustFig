<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>%BRAND_NAME%</title>
    <!--
      The loading screen (note 49) is static HTML inside #root, styled inline because the app's
      stylesheet arrives with the script. React clears #root on its first commit, so it stays up
      exactly until the editor paints; a failed start replaces it with the recovery page.
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f4f5f7;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #52606d;
        font:
          13px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #loading svg {
        width: 56px;
        height: 56px;
      }
      #loading .name {
        font-size: 18px;
        font-weight: 600;
        color: #1f2933;
        letter-spacing: 0.01em;
      }
      #loading .bar {
        width: 120px;
        height: 3px;
        border-radius: 2px;
        background: #e1e4e8;
        overflow: hidden;
      }
      #loading .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #0072b2;
        animation: loading-slide 1.1s ease-in-out infinite alternate;
      }
      @keyframes loading-slide {
        from {
          transform: translateX(-40%);
        }
        to {
          transform: translateX(210%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading" role="status">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect x="4" y="4" width="56" height="56" rx="10" fill="#1f2933" />
          <rect x="13" y="13" width="17" height="17" rx="2" fill="#56b4e9" />
          <circle cx="42.5" cy="21.5" r="8.5" fill="#e69f00" />
          <rect x="13" y="34" width="17" height="17" rx="2" fill="#009e73" />
          <path d="M36 51 L42.5 36 L49 51 Z" fill="#cc79a7" />
        </svg>
        <div class="name">%BRAND_NAME%</div>
        <div class="bar"></div>
        <div>Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
