name: Deploy to GitHub Pages

# Builds the PWA and publishes it to GitHub Pages when a GitHub Release is
# published, so the live site is always a release (as the sibling apps).
# A push to main is checked by ci.yml and deploys nothing. "Run workflow"
# redeploys by hand; run it from a release tag, since it builds whatever
# ref it is started on. Pages is enabled in the repository settings with
# "GitHub Actions" as source. The site is served under /<repo>/, which
# BASE_PATH passes to Vite.
#
# Icon library (note 01): the release of the justfig-icons repository pinned
# in icons.lock.json (version, URL, SHA-256) is downloaded and checked into
# public/lib/<version>/ before the build (`npm run icons`).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Icon library (pinned release)
        run: npm run icons
      - run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # The release build, served under the Pages base, before anything is published. Chromium
      # only: ci.yml already ran all three browsers on this commit; this checks the base path.
      - name: End-to-end tests at the site's base
        run: npm run e2e -- --project=chromium
      - name: Build
        run: npm run build
        env:
          # Usage statistics: cookieless, counts of features only. Unset =
          # tracker off, which is what local and CI builds get. Site 8 on the
          # lab's instance (PlasmidPop is 6, BarelySig 7).
          VITE_MATOMO_URL: https://boonelab.ccbr.utoronto.ca/matomo/
          VITE_MATOMO_SITE_ID: '8'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
